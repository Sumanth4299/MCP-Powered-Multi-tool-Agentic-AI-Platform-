[project]
name = "mcp-productivity-agent"
version = "0.1.0"
description = "Phase 1: Core Authentication & Isolation Backend for MCP Personal Productivity Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.9.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",  
    "fastmcp>=0.4.0",
    "mcp>=1.1.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.20",
    "langgraph-checkpoint-postgres>=2.0.0",
    "streamlit>=1.39.0",
    "httpx>=0.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.140.0",
    "cryptography>=43.0.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "mcp_servers", "frontend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]